[package]
name = "perusal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "perusal-cli"
path = "src/main.rs"

[lib]
name = "perusal_cli"
path = "src/lib.rs"

[dependencies]
perusal-core.workspace = true
clap.workspace = true
perusal-diff.workspace = true
perusal-filter.workspace = true
perusal-providers = { path = "../providers" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
wiremock = "0.6"
serde_json = "1"
