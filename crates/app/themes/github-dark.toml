name = "GitHub Dark"
dark = true

[ui]
background = "#0d1117"
foreground = "#c9d1d9"
accent = "#58a6ff"
border = "#30363d"

[syntax]
keyword = "#ff7b72"
string = "#a5d6ff"
comment = "#8b949e"
number = "#79c0ff"
type = "#ffa657"
function = "#d2a8ff"

[diff]
