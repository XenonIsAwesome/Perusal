[workspace]
resolver = "2"
default-members = ["crates/ui","crates/core","crates/gitops","crates/diff","crates/filter","crates/providers","crates/agents","crates/app","crates/cli"]
members = ["crates/ui","crates/core","crates/gitops","crates/diff","crates/filter","crates/providers","crates/agents","crates/app","crates/cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/XenonIsAwesome/Perusal"

[workspace.dependencies]
perusal-diff = { path = "crates/diff" }
perusal-core = { path = "crates/core" }
perusal-gitops = { path = "crates/gitops" }
perusal-filter = { path = "crates/filter" }
perusal-agents = { path = "crates/agents" }
clap = { version = "4", features = ["derive", "env"] }
