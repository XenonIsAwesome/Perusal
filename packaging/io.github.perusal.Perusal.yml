app-id: io.github.perusal.Perusal
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: perusal
# the 25.08 SDK no longer ships appstream-compose, so the build fails when it runs; the metainfo is still installed as is
appstream-compose: false
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak   # host-spawn: run the host's git and agent CLIs; weakens the sandbox, see docs/flatpak.md
modules:
  - name: perusal
    buildsystem: simple
    build-commands:
      - install -Dm755 perusal /app/bin/perusal
      - install -Dm644 perusal.svg /app/share/icons/hicolor/scalable/apps/io.github.perusal.Perusal.svg
      - sed -i 's/^Icon=.*/Icon=io.github.perusal.Perusal/' perusal.desktop
      - install -Dm644 perusal.desktop /app/share/applications/io.github.perusal.Perusal.desktop
      - install -Dm644 io.github.perusal.Perusal.metainfo.xml /app/share/metainfo/io.github.perusal.Perusal.metainfo.xml
    sources:
      - type: file
        path: ../target/release/perusal
      - type: file
        path: perusal.desktop
      - type: file
        path: ../assets/perusal.svg
      - type: file
        path: io.github.perusal.Perusal.metainfo.xml
